name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  DATABASE_URL: "mysql://school:ci@127.0.0.1:3306/school"
  NEXT_PUBLIC_APP_NAME: "班主任工作台"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      - name: Deployment script tests
        run: |
          npm run test:package
          npm run test:package:standalone
          npm run test:deploy:standalone
          npm run test:deploy:docker
          npm run test:deploy:docker:registry
          npm run test:docker:config
          npm run test:ci:config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        env:
          IMAGE_REF: school:${{ github.sha }}
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BUILD_SHA="$GITHUB_SHA" \
            --tag "$IMAGE_REF" \
            --load \
            .

      - name: Smoke test Docker runtime
        env:
          DOCKER_SMOKE_IMAGE: school:${{ github.sha }}
          DOCKER_SMOKE_PORT: "3101"
        run: npm run test:docker:runtime

      - name: Package Docker image
        if: github.event_name != 'pull_request'
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/school-artifact"
          archive="$RUNNER_TEMP/school-artifact/school-docker-${GITHUB_SHA}.tar.gz"
          docker save "school:${GITHUB_SHA}" | gzip -1 > "$archive"
          (cd "$RUNNER_TEMP/school-artifact" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          cp docker-compose.production.yml "$RUNNER_TEMP/school-artifact/"

      - name: Upload Docker deployment artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: school-docker-${{ github.sha }}
          path: ${{ runner.temp }}/school-artifact/*
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to production
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: school-docker-${{ github.sha }}
          path: artifact

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SCHOOL_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SCHOOL_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_SSH_KEY:?SCHOOL_DEPLOY_SSH_KEY is not configured}"
          : "${DEPLOY_KNOWN_HOSTS:?SCHOOL_DEPLOY_KNOWN_HOSTS is not configured}"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/school-deploy.key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/school-known_hosts"
          chmod 600 "$RUNNER_TEMP/school-deploy.key" "$RUNNER_TEMP/school-known_hosts"

      - name: Upload and atomically activate release
        env:
          DEPLOY_TARGET: ${{ vars.SCHOOL_DEPLOY_TARGET || 'root@39.106.46.229' }}
          DEPLOY_PORT: ${{ vars.SCHOOL_DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.SCHOOL_DEPLOY_PATH || '/www/wwwroot/school.19soul.cn' }}
          DEPLOY_ENV_PATH: ${{ vars.SCHOOL_DEPLOY_ENV_PATH || '/www/wwwroot/school.19soul.cn/.deploy/runtime.env' }}
          DEPLOY_HEALTHCHECK_URL: ${{ vars.SCHOOL_DEPLOY_HEALTHCHECK_URL || 'http://127.0.0.1:3000/api/health' }}
          DEPLOY_KEEP_RELEASES: ${{ vars.SCHOOL_DEPLOY_KEEP_RELEASES || '5' }}
          DEPLOY_COMPOSE_PROJECT: ${{ vars.SCHOOL_DEPLOY_COMPOSE_PROJECT || 'school' }}
          DEPLOY_IMAGE_REF: school:${{ github.sha }}
          DEPLOY_LEGACY_SERVICE: ${{ vars.SCHOOL_DEPLOY_LEGACY_SERVICE || 'school-next.service' }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=10
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/school-known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
            -i "$RUNNER_TEMP/school-deploy.key"
          )
          scp_opts=(
            -P "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=10
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/school-known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
            -i "$RUNNER_TEMP/school-deploy.key"
          )
          mapfile -t archives < <(find artifact -maxdepth 1 -type f -name '*.tar.gz' -print)
          (( ${#archives[@]} == 1 )) || { printf '%s\n' 'deployment artifact count is not 1' >&2; exit 1; }
          archive="${archives[0]}"
          checksum="$archive.sha256"
          compose_file="artifact/docker-compose.production.yml"
          [[ -f "$checksum" ]] || { printf '%s\n' 'deployment checksum is missing' >&2; exit 1; }
          [[ -f "$compose_file" ]] || { printf '%s\n' 'production Compose file is missing' >&2; exit 1; }
          archive_name="$(basename "$archive")"
          release_id="ci-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          incoming="$DEPLOY_PATH/.deploy/incoming"
          remote_archive="$incoming/$archive_name"
          remote_checksum="$remote_archive.sha256"
          remote_compose="$incoming/docker-compose.production-${release_id}.yml"
          ssh "${ssh_opts[@]}" "$DEPLOY_TARGET" "mkdir -p '$incoming'"
          scp "${scp_opts[@]}" "$archive" "$checksum" "$DEPLOY_TARGET:$incoming/"
          scp "${scp_opts[@]}" "$compose_file" "$DEPLOY_TARGET:$remote_compose"
          ssh "${ssh_opts[@]}" "$DEPLOY_TARGET" bash -s -- \
            "$DEPLOY_PATH" \
            "$remote_archive" \
            "$remote_checksum" \
            "$remote_compose" \
            "$release_id" \
            "$DEPLOY_ENV_PATH" \
            "$DEPLOY_COMPOSE_PROJECT" \
            "$DEPLOY_HEALTHCHECK_URL" \
            "$DEPLOY_KEEP_RELEASES" \
            "$DEPLOY_IMAGE_REF" \
            "$DEPLOY_LEGACY_SERVICE" \
            < scripts/remote-deploy-docker.sh
