name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  DATABASE_URL: "mysql://school:ci@127.0.0.1:3306/school"
  NEXT_PUBLIC_APP_NAME: "班主任工作台"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      - name: Deployment script tests
        run: |
          npm run test:package
          npm run test:package:standalone
          npm run test:deploy:standalone
          npm run test:deploy:docker
          npm run test:deploy:docker:registry
          npm run test:docker:config
          npm run test:ci:config

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: BUILD_SHA=${{ github.sha }}
          tags: school:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=school-production
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=school-production' || '' }}

      - name: Smoke test Docker runtime
        env:
          DOCKER_SMOKE_IMAGE: school:${{ github.sha }}
          DOCKER_SMOKE_PORT: "3101"
        run: npm run test:docker:runtime

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        id: publish
        if: github.event_name != 'pull_request'
        run: |
          set -Eeuo pipefail
          image_tag="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker tag "school:${GITHUB_SHA}" "$image_tag"
          docker push "$image_tag"
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image_tag")"
          [[ "$image_ref" =~ ^ghcr[.]io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || {
            printf '发布镜像 digest 非法：%s\n' "$image_ref" >&2
            exit 1
          }
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to production
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SCHOOL_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SCHOOL_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_SSH_KEY:?SCHOOL_DEPLOY_SSH_KEY is not configured}"
          : "${DEPLOY_KNOWN_HOSTS:?SCHOOL_DEPLOY_KNOWN_HOSTS is not configured}"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/school-deploy.key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/school-known_hosts"
          chmod 600 "$RUNNER_TEMP/school-deploy.key" "$RUNNER_TEMP/school-known_hosts"

      - name: Pull and atomically activate release
        env:
          DEPLOY_TARGET: ${{ vars.SCHOOL_DEPLOY_TARGET || 'root@39.106.46.229' }}
          DEPLOY_PORT: ${{ vars.SCHOOL_DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.SCHOOL_DEPLOY_PATH || '/www/wwwroot/school.19soul.cn' }}
          DEPLOY_ENV_PATH: ${{ vars.SCHOOL_DEPLOY_ENV_PATH || '/www/wwwroot/school.19soul.cn/.deploy/runtime.env' }}
          DEPLOY_HEALTHCHECK_URL: ${{ vars.SCHOOL_DEPLOY_HEALTHCHECK_URL || 'http://127.0.0.1:3000/api/health' }}
          DEPLOY_KEEP_RELEASES: ${{ vars.SCHOOL_DEPLOY_KEEP_RELEASES || '2' }}
          DEPLOY_COMPOSE_PROJECT: ${{ vars.SCHOOL_DEPLOY_COMPOSE_PROJECT || 'school' }}
          DEPLOY_IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          DEPLOY_IMAGE_PULL_TIMEOUT_SECONDS: ${{ vars.SCHOOL_DEPLOY_IMAGE_PULL_TIMEOUT_SECONDS || '600' }}
          DEPLOY_LEGACY_SERVICE: ${{ vars.SCHOOL_DEPLOY_LEGACY_SERVICE || 'school-next.service' }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=10
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/school-known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
            -i "$RUNNER_TEMP/school-deploy.key"
          )
          scp_opts=(
            -P "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=10
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/school-known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
            -i "$RUNNER_TEMP/school-deploy.key"
          )
          : "${DEPLOY_IMAGE_REF:?verified image digest is missing}"
          compose_file="docker-compose.production.yml"
          [[ -f "$compose_file" ]] || { printf '%s\n' 'production Compose file is missing' >&2; exit 1; }
          release_id="ci-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          incoming="$DEPLOY_PATH/.deploy/incoming"
          remote_compose="$incoming/docker-compose.production-${release_id}.yml"
          ssh "${ssh_opts[@]}" "$DEPLOY_TARGET" "mkdir -p '$incoming'"
          scp "${scp_opts[@]}" "$compose_file" "$DEPLOY_TARGET:$remote_compose"
          ssh "${ssh_opts[@]}" "$DEPLOY_TARGET" bash -s -- \
            "$DEPLOY_PATH" \
            "$remote_compose" \
            "$release_id" \
            "$DEPLOY_ENV_PATH" \
            "$DEPLOY_COMPOSE_PROJECT" \
            "$DEPLOY_HEALTHCHECK_URL" \
            "$DEPLOY_KEEP_RELEASES" \
            "$DEPLOY_IMAGE_REF" \
            "$DEPLOY_LEGACY_SERVICE" \
            "$DEPLOY_IMAGE_PULL_TIMEOUT_SECONDS" \
            < scripts/remote-deploy-docker-registry.sh
