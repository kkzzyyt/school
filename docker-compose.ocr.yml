services:
  seating-ocr:
    build:
      context: ./ocr-service
    image: school-seating-ocr:0.1.0
    restart: unless-stopped
    init: true
    mem_limit: 1250m
    pids_limit: 64
    ports:
      - "127.0.0.1:8077:8077"
    environment:
      OCR_BIND: "0.0.0.0"
      OCR_PORT: "8077"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - school_ocr_models:/home/ocr/.paddlex
    security_opt:
      - no-new-privileges:true

volumes:
  school_ocr_models:
