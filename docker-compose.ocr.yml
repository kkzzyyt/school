services:
  seating-ocr:
    build:
      context: ./ocr-service
    image: school-seating-ocr:0.1.0
    restart: unless-stopped
    init: true
    mem_limit: 1250m
    pids_limit: 64
    # Host networking matches the production app and uses the host's working DNS.
    network_mode: host
    environment:
      OCR_BIND: "127.0.0.1"
      OCR_PORT: "8077"
      PADDLE_PDX_MODEL_SOURCE: "bos"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    security_opt:
      - no-new-privileges:true
